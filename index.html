<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA OFICINA | Catálogo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oficina: {
                            black: '#0a0a0a',   /* Negro Profundo */
                            bone: '#F3EFE6',    /* Hueso Elegante */
                            gray: '#8a8a8a',    /* Gris */
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    animation: {
                        'slideUp': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fadeIn': 'fadeIn 0.4s ease-out forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background-color: #0a0a0a; color: #F3EFE6; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-oficina-black text-oficina-bone antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN FIREBASE (Desde tu archivo POS) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- ICONO LOGOTIPO OFICIAL (SVG Vectorizado) ---
        const LogoOficina = ({ className }) => (
            <svg viewBox="0 0 100 100" className={className} fill="currentColor">
                <defs>
                    <mask id="glass-mask">
                        <rect width="100" height="100" fill="white" />
                        <path d="M 32 44 C 32 64 45 66 50 66 C 55 66 68 64 68 44 Z" fill="black" />
                        <rect x="47.5" y="65" width="5" height="15" fill="black" />
                        <path d="M 36 85 C 36 78 64 78 64 85 Z" fill="black" />
                    </mask>
                </defs>
                <path d="M 45 38 C 40 30 52 24 45 14 C 42 10 46 6 50 4" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <path d="M 55 38 C 50 30 62 24 55 14" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <circle cx="62" cy="12" r="4" fill="currentColor"/>
                <path d="M 15 45 L 85 45 C 85 75 65 85 50 85 C 35 85 15 75 15 45 Z" fill="currentColor" mask="url(#glass-mask)"/>
                <path d="M 82 50 C 102 50 102 75 78 75" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round"/>
            </svg>
        );

        const IconBase = ({ children, className, size=24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const X = (props) => <IconBase {...props}><path d="M18 6L6 18M6 6l12 12"/></IconBase>;

        // --- COMPONENTES DE LA INTERFAZ ---

        const ProductGridItem = ({ product, onClick }) => (
            <div className="relative aspect-square cursor-pointer overflow-hidden bg-oficina-bone/5" onClick={() => onClick(product)}>
                {product.imageUrl ? (
                    <img src={product.imageUrl} alt={product.name} className="w-full h-full object-cover transition-transform duration-300 hover:scale-105" />
                ) : (
                    <div className="w-full h-full flex flex-col items-center justify-center p-2 text-center border border-oficina-bone/10">
                         <LogoOficina className="w-8 h-8 text-oficina-bone/20 mb-1" />
                        <span className="text-[8px] uppercase font-bold text-oficina-gray tracking-widest line-clamp-2">{product.name}</span>
                    </div>
                )}
                <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-2">
                    <p className="text-[9px] font-black text-oficina-bone tracking-tighter truncate">${product.price.toLocaleString()}</p>
                </div>
            </div>
        );

        const ProductModal = ({ product, onClose }) => (
            <div className="fixed inset-0 z-50 bg-oficina-black/98 flex flex-col items-center justify-center p-4 animate-fadeIn" onClick={onClose}>
                <button onClick={onClose} className="absolute top-6 right-6 p-2 text-oficina-bone/50 hover:text-oficina-bone"><X size={32} /></button>
                <div className="max-w-md w-full bg-oficina-black rounded-3xl overflow-hidden border border-oficina-bone/10 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                    {product.imageUrl ? (
                        <img src={product.imageUrl} alt={product.name} className="w-full aspect-square object-cover" />
                    ) : (
                        <div className="w-full aspect-square bg-oficina-bone/5 flex flex-col items-center justify-center p-8 text-center border-b border-oficina-bone/10">
                            <LogoOficina className="w-32 h-32 text-oficina-bone/10 mb-4" />
                        </div>
                    )}
                    <div className="p-8">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <p className="text-[10px] uppercase tracking-[0.3em] font-bold text-oficina-gray mb-1">{product.category}</p>
                                <h3 className="font-bold text-2xl text-oficina-bone leading-tight">{product.name}</h3>
                            </div>
                            <span className="font-black text-oficina-bone text-xl mt-1">${product.price.toLocaleString()}</span>
                        </div>
                        {product.description && <p className="text-sm text-oficina-gray leading-relaxed mb-6 font-medium">{product.description}</p>}
                        
                        {product.category === 'Combos' && product.items && (
                            <div className="bg-oficina-bone/5 p-4 rounded-2xl border border-oficina-bone/10">
                                <p className="text-[10px] uppercase tracking-widest text-oficina-gray font-bold mb-3">Este combo incluye:</p>
                                <div className="space-y-2">
                                    {product.items.map((itemId, index) => (
                                        <p key={index} className="text-xs text-oficina-bone/70 flex items-center gap-2">• Producto del menú</p>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [inventory, setInventory] = useState([]);
            const [combos, setCombos] = useState([]);
            const [categories, setCategories] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [activeCategory, setActiveCategory] = useState('');
            const [selectedProduct, setSelectedProduct] = useState(null);

            useEffect(() => {
                const unsubInv = db.collection('inventory').onSnapshot(snap => setInventory(snap.docs.map(doc => doc.data())));
                const unsubComb = db.collection('combos').onSnapshot(snap => {
                    setCombos(snap.docs.map(doc => doc.data()));
                    setIsLoading(false);
                });
                return () => { unsubInv(); unsubComb(); };
            }, []);

            const displayInventory = useMemo(() => [...inventory, ...combos], [inventory, combos]);

            useEffect(() => {
                if (displayInventory.length > 0) {
                    const uniqueCategories = [...new Set(displayInventory.map(item => item.category).filter(Boolean))].sort();
                    setCategories(uniqueCategories);
                    if (!activeCategory && uniqueCategories.length > 0) setActiveCategory(uniqueCategories[0]);
                }
            }, [displayInventory]);

            const scrollToCategory = (category) => {
                setActiveCategory(category);
                const element = document.getElementById(`cat-${category}`);
                if (element) {
                    const y = element.getBoundingClientRect().top + window.scrollY - 130; 
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }
            };

            if (isLoading) return (
                <div className="min-h-screen bg-oficina-black flex flex-col items-center justify-center">
                    <LogoOficina className="w-24 h-24 text-oficina-bone animate-pulse" />
                </div>
            );

            return (
                <div className="relative min-h-screen pb-24 max-w-md mx-auto bg-oficina-black shadow-2xl overflow-hidden">
                    
                    <header className="relative bg-oficina-black text-oficina-bone pb-10 pt-16 px-6 rounded-b-[2rem] border-b border-oficina-bone/10 z-20 flex flex-col items-center text-center">
                        <LogoOficina className="w-28 h-28 text-oficina-bone mb-4" />
                        <h1 className="text-3xl font-black tracking-widest uppercase">LA OFICINA</h1>
                        <p className="text-[10px] uppercase tracking-[0.25em] font-semibold mt-1 text-oficina-bone/70">Café & Cocktails</p>

                        <div className="mt-8 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest text-oficina-bone/50 border border-oficina-bone/20 px-4 py-1.5 rounded-full">
                            <span className="w-1.5 h-1.5 rounded-full bg-oficina-bone animate-pulse"></span>
                            Catálogo en Vivo
                        </div>
                    </header>

                    <div className="sticky top-0 z-30 bg-oficina-black/95 backdrop-blur-md border-b border-oficina-bone/10 py-4 px-4">
                        <div className="flex gap-6 overflow-x-auto scrollbar-hide pb-2">
                            {categories.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => scrollToCategory(cat)}
                                    className={`whitespace-nowrap text-[10px] uppercase tracking-widest font-black transition-all border-b-2 pb-1 ${activeCategory === cat ? 'text-oficina-bone border-oficina-bone' : 'text-oficina-gray border-transparent'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="p-1 space-y-12">
                        {categories.map(category => {
                            const productsInCategory = displayInventory.filter(p => p.category === category);
                            if (productsInCategory.length === 0) return null;

                            return (
                                <div key={category} id={`cat-${category}`} className="scroll-mt-36">
                                    <h2 className="text-[11px] font-black uppercase tracking-[0.3em] text-oficina-gray mb-4 mt-6 border-l-4 border-oficina-bone pl-3">{category}</h2>
                                    <div className="grid grid-cols-3 gap-1">
                                        {productsInCategory.map(product => (
                                            <ProductGridItem key={product.id} product={product} onClick={setSelectedProduct} />
                                        ))}
                                    </div>
                                </div>
                            )
                        })}
                    </div>

                    <div className="pt-20 pb-12 flex flex-col items-center opacity-20">
                        <LogoOficina className="w-12 h-12 text-oficina-gray mb-2" />
                        <p className="text-[8px] font-bold uppercase tracking-[0.4em]">Experiencia Visual</p>
                    </div>

                    {selectedProduct && (
                        <ProductModal product={selectedProduct} onClose={() => setSelectedProduct(null)} />
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
