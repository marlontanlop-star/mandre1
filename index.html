<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA OFICINA | Menú Digital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oficina: {
                            black: '#0a0a0a',   /* Negro Profundo */
                            bone: '#F3EFE6',    /* Hueso Elegante */
                            gray: '#8a8a8a',    /* Gris para textos secundarios */
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    animation: {
                        'slideUp': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fadeIn': 'fadeIn 0.4s ease-out forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background-color: #F3EFE6; color: #0a0a0a; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-oficina-bone text-oficina-black antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN FIREBASE (Extraída de tu POS) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Habilitar caché offline para que cargue súper rápido
        db.enablePersistence({ synchronizeTabs: true }).catch(function(err) {
            console.log("Error habilitando persistencia offline:", err);
        });

        // --- ICONOS BASE ---
        const IconBase = ({ children, className, size=24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Plus = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const Minus = (props) => <IconBase {...props}><path d="M5 12h14"/></IconBase>;
        const ArrowLeft = (props) => <IconBase {...props}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></IconBase>;

        // --- LOGO VECTORIAL LA OFICINA ---
        const LogoOficina = ({ className }) => (
            <svg viewBox="0 0 100 100" className={className} fill="currentColor">
                <defs>
                    <mask id="glass-mask">
                        <rect width="100" height="100" fill="white" />
                        <path d="M 32 44 C 32 64 45 66 50 66 C 55 66 68 64 68 44 Z" fill="black" />
                        <rect x="47.5" y="65" width="5" height="15" fill="black" />
                        <path d="M 36 85 C 36 78 64 78 64 85 Z" fill="black" />
                    </mask>
                </defs>
                <path d="M 45 38 C 40 30 52 24 45 14 C 42 10 46 6 50 4" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <path d="M 55 38 C 50 30 62 24 55 14" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <circle cx="62" cy="12" r="4" fill="currentColor"/>
                <path d="M 15 45 L 85 45 C 85 75 65 85 50 85 C 35 85 15 75 15 45 Z" fill="currentColor" mask="url(#glass-mask)"/>
                <path d="M 82 50 C 102 50 102 75 78 75" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round"/>
            </svg>
        );

        const App = () => {
            // ESTADOS DE DATOS DE FIREBASE
            const [inventory, setInventory] = useState([]);
            const [combos, setCombos] = useState([]);
            const [categories, setCategories] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            // ESTADOS DE UI Y CARRITO
            const [activeCategory, setActiveCategory] = useState('');
            const [cart, setCart] = useState([]);
            const [isCartModalOpen, setIsCartModalOpen] = useState(false);

            // --- 1. SINCRONIZACIÓN CON FIREBASE EN TIEMPO REAL ---
            useEffect(() => {
                const unsubInv = db.collection('inventory').onSnapshot(snap => {
                    setInventory(snap.docs.map(doc => doc.data()));
                });
                
                const unsubComb = db.collection('combos').onSnapshot(snap => {
                    setCombos(snap.docs.map(doc => doc.data()));
                    setIsLoading(false); // Quitar loader cuando lleguen los datos
                });

                return () => {
                    unsubInv();
                    unsubComb();
                };
            }, []);

            // Combinar productos individuales y combos
            const displayInventory = useMemo(() => {
                return [...inventory, ...combos];
            }, [inventory, combos]);

            // --- 2. EXTRAER CATEGORÍAS DINÁMICAMENTE ---
            useEffect(() => {
                if (displayInventory.length > 0) {
                    // Extraer categorías únicas asegurando que no haya vacías
                    const uniqueCategories = [...new Set(displayInventory.map(item => item.category).filter(Boolean))];
                    
                    // Ordenar (opcional: puedes poner "Café" o "Combos" de primero si quieres)
                    const sortedCategories = uniqueCategories.sort();
                    
                    setCategories(sortedCategories);
                    if (!activeCategory && sortedCategories.length > 0) {
                        setActiveCategory(sortedCategories[0]);
                    }
                }
            }, [displayInventory]);

            // CÁLCULOS DEL CARRITO
            const cartTotalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartTotalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const updateCart = (product, delta) => {
                setCart(prevCart => {
                    const existingItem = prevCart.find(item => item.id === product.id);
                    if (existingItem) {
                        const newQuantity = existingItem.quantity + delta;
                        if (newQuantity <= 0) {
                            return prevCart.filter(item => item.id !== product.id);
                        }
                        return prevCart.map(item => 
                            item.id === product.id ? { ...item, quantity: newQuantity } : item
                        );
                    } else if (delta > 0) {
                        return [...prevCart, { ...product, quantity: 1 }];
                    }
                    return prevCart;
                });
            };

            const getQuantityInCart = (productId) => {
                const item = cart.find(item => item.id === productId);
                return item ? item.quantity : 0;
            };

            const scrollToCategory = (category) => {
                setActiveCategory(category);
                const element = document.getElementById(`cat-${category}`);
                if (element) {
                    const y = element.getBoundingClientRect().top + window.scrollY - 130; 
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }
            };

            // INTERSECTION OBSERVER PARA ACTUALIZAR NAVEGACIÓN AL HACER SCROLL
            useEffect(() => {
                if (categories.length === 0) return;
                
                const observers = [];
                categories.forEach(category => {
                    const element = document.getElementById(`cat-${category}`);
                    if (element) {
                        const observer = new IntersectionObserver(
                            ([entry]) => {
                                if (entry.isIntersecting) setActiveCategory(category);
                            },
                            { rootMargin: '-140px 0px -60% 0px' }
                        );
                        observer.observe(element);
                        observers.push(observer);
                    }
                });
                return () => observers.forEach(obs => obs.disconnect());
            }, [categories]);

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-oficina-bone flex flex-col items-center justify-center">
                        <LogoOficina className="w-20 h-20 text-oficina-black animate-pulse" />
                        <p className="mt-4 text-xs tracking-[0.2em] uppercase font-bold text-oficina-gray animate-pulse">Cargando Menú...</p>
                    </div>
                );
            }

            return (
                <div className="relative min-h-screen pb-24 max-w-md mx-auto bg-oficina-bone shadow-2xl overflow-hidden">
                    
                    {/* HEADER MINIMALISTA NEGRO CON LOGO INCRUSTADO */}
                    <header className="relative bg-oficina-black text-oficina-bone pb-10 pt-16 px-6 rounded-b-[2rem] shadow-lg z-20 flex flex-col items-center text-center">
                        <LogoOficina className="w-28 h-28 text-oficina-bone mb-3" />
                        <h1 className="text-3xl font-black tracking-widest uppercase">LA OFICINA</h1>
                        <p className="text-[10px] uppercase tracking-[0.25em] font-semibold mt-1 text-oficina-bone/70">Café & Cocktails</p>

                        <div className="mt-8 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest text-oficina-bone/50 border border-oficina-bone/20 px-4 py-1.5 rounded-full">
                            <span className="w-1.5 h-1.5 rounded-full bg-oficina-bone animate-pulse"></span>
                            Catálogo en Vivo
                        </div>
                    </header>

                    {/* NAVEGACIÓN STICKY */}
                    <div className="sticky top-0 z-30 bg-oficina-bone/95 backdrop-blur-sm border-b border-oficina-black/10 py-4 px-4">
                        <div className="flex gap-6 overflow-x-auto scrollbar-hide pb-2">
                            {categories.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => scrollToCategory(cat)}
                                    className={`whitespace-nowrap text-xs uppercase tracking-widest font-bold transition-all border-b-2 pb-1 ${activeCategory === cat ? 'text-oficina-black border-oficina-black' : 'text-oficina-gray border-transparent hover:text-oficina-black'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* LISTADO DE PRODUCTOS DESDE FIREBASE */}
                    <div className="p-6 space-y-12">
                        {categories.map(category => {
                            const productsInCategory = displayInventory.filter(p => p.category === category);
                            if (productsInCategory.length === 0) return null;

                            return (
                                <div key={category} id={`cat-${category}`} className="scroll-mt-36">
                                    <h2 className="text-sm font-black uppercase tracking-[0.2em] text-oficina-gray mb-6 border-b border-oficina-black/10 pb-2">{category}</h2>
                                    <div className="space-y-6">
                                        {productsInCategory.map(product => {
                                            const qty = getQuantityInCart(product.id);
                                            return (
                                                <div key={product.id} className="flex flex-col gap-2">
                                                    <div className="flex justify-between items-start">
                                                        <div className="pr-4">
                                                            <div className="flex items-center gap-2">
                                                                <h3 className="font-bold text-base text-oficina-black leading-tight">{product.name}</h3>
                                                            </div>
                                                            {/* Mostrar descripción si existe, sino un texto en blanco o ingredientes del combo */}
                                                            {product.description && <p className="text-xs text-oficina-gray mt-1 leading-relaxed">{product.description}</p>}
                                                            {product.category === 'Combos' && <p className="text-[10px] uppercase tracking-widest text-oficina-gray mt-1 opacity-70">Incluye {product.items?.length || 0} productos</p>}
                                                        </div>
                                                        <span className="font-bold text-oficina-black text-sm whitespace-nowrap">${product.price.toLocaleString()}</span>
                                                    </div>
                                                    
                                                    <div className="flex justify-end mt-2">
                                                        {qty === 0 ? (
                                                            <button 
                                                                onClick={() => updateCart(product, 1)}
                                                                className="text-[10px] uppercase tracking-widest font-bold border border-oficina-black text-oficina-black px-4 py-1.5 rounded-full hover:bg-oficina-black hover:text-oficina-bone transition-colors"
                                                            >
                                                                Agregar
                                                            </button>
                                                        ) : (
                                                            <div className="flex items-center gap-4 bg-oficina-black text-oficina-bone rounded-full px-2 py-1">
                                                                <button onClick={() => updateCart(product, -1)} className="p-1 hover:opacity-70 transition-opacity"><Minus size={14}/></button>
                                                                <span className="text-xs font-bold w-4 text-center">{qty}</span>
                                                                <button onClick={() => updateCart(product, 1)} className="p-1 hover:opacity-70 transition-opacity"><Plus size={14}/></button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )
                        })}
                    </div>

                    {/* BARRA INFERIOR DE COMPRA */}
                    {cartTotalItems > 0 && !isCartModalOpen && (
                        <div className="fixed bottom-6 left-6 right-6 max-w-md mx-auto z-40 animate-slideUp">
                            <button 
                                onClick={() => setIsCartModalOpen(true)}
                                className="w-full bg-oficina-black text-oficina-bone p-4 rounded-full shadow-2xl flex items-center justify-between active:scale-95 transition-transform border border-oficina-bone/10"
                            >
                                <div className="flex items-center gap-3">
                                    <div className="bg-oficina-bone text-oficina-black w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs">
                                        {cartTotalItems}
                                    </div>
                                    <span className="font-bold text-xs uppercase tracking-widest">Ver Orden</span>
                                </div>
                                <span className="font-black text-lg">${cartTotalPrice.toLocaleString()}</span>
                            </button>
                        </div>
                    )}

                    {/* MODAL DEL CARRITO */}
                    {isCartModalOpen && (
                        <div className="fixed inset-0 bg-oficina-bone z-50 flex flex-col animate-slideUp max-w-md mx-auto">
                            
                            <div className="p-6 border-b border-oficina-black/10 flex items-center justify-between bg-oficina-bone shrink-0">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setIsCartModalOpen(false)} className="p-2 text-oficina-black hover:opacity-70"><ArrowLeft size={24}/></button>
                                    <h2 className="font-black text-xl uppercase tracking-widest text-oficina-black">Orden</h2>
                                </div>
                                <button onClick={() => { setCart([]); setIsCartModalOpen(false); }} className="text-[10px] font-bold text-oficina-gray uppercase tracking-widest hover:text-oficina-black transition-colors">Vaciar</button>
                            </div>

                            <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                {cart.map(item => (
                                    <div key={item.id} className="flex items-center justify-between border-b border-oficina-black/5 pb-4">
                                        <div className="flex flex-col">
                                            <span className="font-bold text-sm text-oficina-black uppercase tracking-wide">{item.name}</span>
                                            <span className="text-oficina-gray font-medium text-xs mt-1">${(item.price * item.quantity).toLocaleString()}</span>
                                        </div>
                                        <div className="flex items-center gap-3 bg-oficina-black text-oficina-bone rounded-full px-2 py-1">
                                            <button onClick={() => updateCart(item, -1)} className="p-1 hover:opacity-70 transition-opacity"><Minus size={14}/></button>
                                            <span className="text-xs font-bold w-4 text-center">{item.quantity}</span>
                                            <button onClick={() => updateCart(item, 1)} className="p-1 hover:opacity-70 transition-opacity"><Plus size={14}/></button>
                                        </div>
                                    </div>
                                ))}

                                <div className="mt-8 pt-4">
                                    <label className="text-[10px] font-bold text-oficina-gray uppercase tracking-widest block mb-3">Notas para la barra</label>
                                    <textarea id="order-notes" className="w-full bg-transparent border-b-2 border-oficina-black/20 p-2 outline-none focus:border-oficina-black text-sm resize-none h-16 transition-colors" placeholder="Ej: Sin azúcar, hielo extra..."></textarea>
                                </div>
                            </div>

                            <div className="p-6 bg-oficina-black text-oficina-bone shrink-0 rounded-t-[2rem]">
                                <div className="flex justify-between items-center mb-6 border-b border-oficina-bone/20 pb-4">
                                    <span className="font-bold text-xs uppercase tracking-widest">Total a Pagar</span>
                                    <span className="font-black text-3xl">${cartTotalPrice.toLocaleString()}</span>
                                </div>
                                <button 
                                    onClick={() => {
                                        const notas = document.getElementById('order-notes').value;
                                        let text = `¡Hola! Quiero hacer un pedido en La Oficina:%0A%0A`;
                                        cart.forEach(item => {
                                            text += `▪ ${item.quantity}x ${item.name} ($${(item.price * item.quantity).toLocaleString()})%0A`;
                                        });
                                        if(notas) text += `%0A📝 Notas: ${notas}%0A`;
                                        text += `%0A💰 *TOTAL: $${cartTotalPrice.toLocaleString()}*`;
                                        
                                        // Reemplaza el 573000000000 por tu número de WhatsApp
                                        window.open(`https://wa.me/573000000000?text=${text}`, '_blank');
                                    }}
                                    className="w-full bg-oficina-bone text-oficina-black py-4 rounded-full font-black text-xs uppercase tracking-widest active:scale-95 transition-transform"
                                >
                                    Enviar Pedido por WhatsApp
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
