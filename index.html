<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Oficina Coffee Bar</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --green: #2d5a27; }
        
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            background: #f8f8f8;
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 70px;
        }
        
        header {
            text-align: center;
            padding: 30px 20px 18px;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }
        
        #categories {
            display: flex;
            overflow-x: auto;
            padding: 12px 10px;
            gap: 10px;
            background: white;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
        }
        #categories::-webkit-scrollbar { display: none; }
        
        .cat-pill {
            padding: 11px 20px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--green);
            border: 2px solid var(--green);
            border-radius: 50px;
            white-space: nowrap;
            background: white;
            transition: all 0.3s ease;
        }
        
        .cat-pill.active {
            background: var(--green);
            color: white;
        }
        
        .feed {
            max-width: 500px;
            margin: 0 auto;
            padding: 12px 10px;
        }
        
        .post {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 26px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }
        
        .post-img-container {
            position: relative;
            width: 100%;
            padding-top: 125%;
        }
        
        .post img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .post-info {
            padding: 18px;
        }
        
        .post-info h3 {
            font-size: 17.5px;
            font-weight: 700;
            margin-bottom: 7px;
        }
        
        .post-info p {
            font-size: 14.5px;
            color: #555;
            line-height: 1.45;
        }
        
        .price {
            font-size: 20px;
            font-weight: 700;
            color: var(--green);
            margin-top: 14px;
        }
        
        footer {
            text-align: center;
            padding: 30px 20px 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo solo texto - versión elegante -->
        <svg width="300" height="110" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <text x="160" y="55" font-family="Montserrat" font-size="31" font-weight="700" fill="#2d5a27" letter-spacing="-1.8px" text-anchor="middle">LA OFICINA</text>
            <text x="160" y="80" font-family="Montserrat" font-size="11.5" font-weight="600" fill="#2d5a27" letter-spacing="5.5px" text-anchor="middle">COFFEE BAR</text>
        </svg>
    </header>

    <div id="categories"></div>
    <div id="menu-container" class="feed"></div>

    <footer>
        LA OFICINA COFFEE BAR
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allProducts = [];

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            container.innerHTML = items.map(p => `
                <div class="post">
                    <div class="post-img-container">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/600x750/eeeeee/2d5a27?text=La+Oficina'}" alt="${p.name}">
                    </div>
                    <div class="post-info">
                        <h3>${p.name}</h3>
                        <p>${p.description || ''}</p>
                        <div class="price">$${Number(p.price).toLocaleString('es-CO')}</div>
                    </div>
                </div>
            `).join('');
        }

        db.collection('inventory').onSnapshot(snap => {
            allProducts = [];
            let cats = new Set(['TODOS']);

            snap.forEach(doc => {
                const p = doc.data();
                if (p.showOnTv !== false) {
                    allProducts.push(p);
                    if (p.category) cats.add(p.category.toUpperCase());
                }
            });

            const catHTML = Array.from(cats).map(c => 
                `<div class="cat-pill ${c==='TODOS'?'active':''}" onclick="filterMenu('${c}')">${c}</div>`
            ).join('');
            document.getElementById('categories').innerHTML = catHTML;

            renderMenu(allProducts);
        });

        function filterMenu(cat) {
            document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            const filtered = cat === 'TODOS' 
                ? allProducts 
                : allProducts.filter(p => (p.category || '').toUpperCase() === cat);
            renderMenu(filtered);
        }
    </script>
</body>
</html>
