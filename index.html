<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo | LA OFICINA Coffee Bar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oficina: {
                            bg: '#e3e4d4',      
                            verde: '#4B5320',   
                            claro: '#8FBC8F', 
                            gris: '#A8A899',    
                            dark: '#2d3314',    
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    animation: {
                        'slideUp': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fadeIn': 'fadeIn 0.4s ease-out forwards',
                        'humo': 'subir-bajar 3s ease-in-out infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        'subir-bajar': {
                            '0%, 100%': { transform: 'translateY(0)', opacity: '0.4' },
                            '50%': { transform: 'translateY(-15px)', opacity: '0.8' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background-color: #e3e4d4; color: #4B5320; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        html { scroll-behavior: smooth; }
        .taza-path { fill: none; stroke: #4B5320; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
        .humo-path { fill: none; stroke: #A8A899; stroke-width: 10; stroke-linecap: round; }
        input[type="checkbox"] { accent-color: #4B5320; }
    </style>
</head>
<body class="bg-oficina-bg text-oficina-verde antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        const HABLAME_CONFIG = {
            apiKey: "HHajMRAMKfQrSqkw4WA5dwuWh8xl9RJDeyQTanQJDKXpCLOgPzNEDF1hnY93zd39Ge7tXt20b3nTsMEocV6B0ibTIrvxmgjtN1OmUguZGja4zkABwNW0GdUqmoJ67Zq6",
            endpoint: "https://api103.hablame.co/api/sms/v3/send/marketing"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const LogoOficina = ({ className }) => (
            <svg className={className} viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
                <path className="humo-path animate-humo" d="M100,70 c10,-20, -10,-40, 0,-60" />
                <path className="taza-path" d="M40,95 h120 c0,0,0,60-60,60 S40,95,40,95 z" />
                <path className="taza-path" d="M160,105 c15,0,25,10,25,22 s-10,22-25,22" />
            </svg>
        );

        const IconBase = ({ children, className, size=24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const X = (props) => <IconBase {...props}><path d="M18 6L6 18M6 6l12 12"/></IconBase>;
        const Instagram = (props) => (
            <IconBase {...props}>
                <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
            </IconBase>
        );
        const UserPlus = (props) => (
            <IconBase {...props}>
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" x2="20" y1="8" y2="14"/><line x1="23" x2="17" y1="11" y2="11"/>
            </IconBase>
        );

        // --- COMPONENTE DE TRAZABILIDAD ---
        const TraceabilityAnnouncement = ({ data, isOpen, onClose }) => {
            if (!isOpen || !data) return null;
            const cafe = data.cafePromocion || {};
            const nombreCafe = data.publicidadRecurrente?.textoConfigurable || "Nuestro Café de Especialidad";

            return (
                <div className="fixed inset-0 z-[70] bg-oficina-dark/60 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn">
                    <div className="bg-oficina-bg w-full max-w-sm rounded-[2.5rem] overflow-hidden shadow-2xl border-4 border-oficina-verde/20 animate-slideUp relative">
                        <button onClick={onClose} className="absolute top-6 right-6 text-oficina-verde/40 transition-transform active:scale-90"><X size={24}/></button>
                        
                        <div className="p-8 flex flex-col items-center text-center">
                            {/* Logo en Sello Circular Perfecto */}
                            <div className="w-24 h-24 bg-white p-3 rounded-full shadow-lg mb-6 flex items-center justify-center border-4 border-oficina-claro overflow-hidden">
                                {cafe.logoUrl ? (
                                    <img src={cafe.logoUrl} className="w-full h-full object-contain" alt="Logo Café" />
                                ) : (
                                    <LogoOficina className="w-full h-full opacity-20" />
                                )}
                            </div>
                            
                            <p className="text-[10px] text-oficina-verde font-bold uppercase tracking-[0.2em] mb-2 opacity-70">
                                La base de todas nuestras preparaciones es este grano de autor:
                            </p>
                            
                            <h3 className="text-oficina-verde font-black text-2xl uppercase tracking-tighter leading-tight mb-6">
                                {nombreCafe}
                            </h3>
                            
                            <div className="w-full space-y-2 mb-8 text-left">
                                <div className="grid grid-cols-2 gap-2">
                                    <div className="bg-white/40 p-3 rounded-xl border border-oficina-verde/5">
                                        <span className="text-[8px] font-bold text-oficina-gris uppercase block mb-1">Vereda</span>
                                        <span className="text-xs font-black text-oficina-verde uppercase truncate">{cafe.vereda || '---'}</span>
                                    </div>
                                    <div className="bg-white/40 p-3 rounded-xl border border-oficina-verde/5">
                                        <span className="text-[8px] font-bold text-oficina-gris uppercase block mb-1">Municipio</span>
                                        <span className="text-xs font-black text-oficina-verde uppercase">Anserma, Caldas</span>
                                    </div>
                                    <div className="bg-white/40 p-3 rounded-xl border border-oficina-verde/5">
                                        <span className="text-[8px] font-bold text-oficina-gris uppercase block mb-1">Altura Cultivo</span>
                                        <span className="text-xs font-black text-oficina-verde">{cafe.altura || '---'} MSNM</span>
                                    </div>
                                    <div className="bg-white/40 p-3 rounded-xl border border-oficina-verde/5">
                                        <span className="text-[8px] font-bold text-oficina-gris uppercase block mb-1">Procesador</span>
                                        <span className="text-xs font-black text-oficina-verde uppercase truncate">{cafe.procesador || '---'}</span>
                                    </div>
                                </div>
                                
                                <div className="bg-oficina-claro p-4 rounded-2xl shadow-sm">
                                    <p className="text-[8px] font-black text-oficina-dark/60 uppercase mb-1 tracking-widest">Perfil de Taza</p>
                                    <p className="text-sm font-black text-oficina-dark italic leading-tight">"{cafe.notas || 'Equilibrio y aroma de montaña'}"</p>
                                </div>

                                <div className="bg-white/40 p-3 rounded-xl border border-oficina-verde/5 flex justify-between items-center px-4">
                                    <span className="text-[8px] font-bold text-oficina-gris uppercase">Día de Tueste</span>
                                    <span className="text-xs font-black text-oficina-verde">{cafe.diaTueste || 'Reciente'}</span>
                                </div>
                            </div>

                            <p className="text-[12px] text-oficina-verde/80 font-medium leading-tight mb-8 italic">
                                "Honramos el sudor y la pasión de las manos que cultivan esperanza en nuestras Montañas Ansermeñas."
                            </p>

                            <button onClick={onClose} className="w-full bg-oficina-verde text-white font-black py-4 rounded-2xl uppercase tracking-[0.2em] text-[11px] shadow-lg active:scale-95 transition-all">
                                Explorar Catálogo
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const RegistrationModal = ({ isOpen, onClose }) => {
    const [formData, setFormData] = useState({ name: '', phone: '', consent: false });
    const [status, setStatus] = useState('idle');

    const sendWelcomeSMS = async (phone, name) => {
        const firstName = name.split(' ')[0];
        try {
            await fetch(HABLAME_CONFIG.endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': HABLAME_CONFIG.apiKey
                },
                body: JSON.stringify({
                    phone: `57${phone}`,
                    message: `Hola ${firstName}, bienvenido a LA OFICINA Coffee Bar. Gracias por unirte a nuestro Club. Pronto recibiras nuestras mejores promociones.`,
                    flash: 0
                })
            });
        } catch (e) {
            console.error("SMS Error:", e);
        }
    };

    const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.consent) return;
        setStatus('loading');
        try {
            await db.collection('customers').add({
                ...formData,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            await sendWelcomeSMS(formData.phone, formData.name);
            
            setStatus('success');
            setTimeout(() => {
                onClose();
                setFormData({ name: '', phone: '', consent: false });
                setStatus('idle');
            }, 2000);
        } catch (error) {
            console.error("Error saving customer:", error);
            setStatus('idle');
        }
    };

    if (!isOpen) return null;

    return (
        /* CAMBIO: Agregamos flex-col y aseguramos que el fondo cubra todo */
        <div className="fixed inset-0 z-[60] bg-oficina-dark/40 backdrop-blur-sm flex flex-col items-end sm:items-center justify-end sm:justify-center p-0 sm:p-4 animate-fadeIn">
            
            {/* CAMBIO: max-h-[90dvh] para que no choque con el techo y overflow-y-auto para el scroll */}
            <div className="bg-oficina-bg w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-8 shadow-2xl animate-slideUp relative overflow-y-auto max-h-[90dvh]">
                
                <button onClick={onClose} className="absolute top-6 right-6 text-oficina-verde/40 z-10">
                    <X size={24}/>
                </button>
                
                {status === 'success' ? (
                    <div className="py-12 text-center space-y-4">
                        <div className="w-16 h-16 bg-oficina-verde text-white rounded-full flex items-center justify-center mx-auto animate-bounce">
                            <svg size={32} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3" className="w-8 h-8"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <h3 className="font-bold text-oficina-verde">¡Registro Exitoso!</h3>
                        <p className="text-[10px] text-oficina-gris uppercase tracking-widest text-center">Revisa tu celular, te enviamos un mensaje</p>
                    </div>
                ) : (
                    <>
                        <div className="mb-8">
                            <h3 className="text-xl font-black text-oficina-verde uppercase tracking-tight">El Club de La Oficina</h3>
                            <p className="text-[10px] text-oficina-gris font-bold uppercase tracking-widest">Accede a descuentos VIP y promociones imperdibles</p>
                        </div>

                        {/* CAMBIO: Añadimos pb-6 para dar espacio extra al final del formulario */}
                        <form onSubmit={handleSubmit} className="space-y-4 pb-6">
                            <div className="space-y-1">
                                <label className="text-[9px] uppercase font-bold text-oficina-verde/60 ml-1">Nombre Completo</label>
                                <input 
                                    required
                                    type="text"
                                    className="w-full bg-white border border-oficina-verde/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-oficina-verde transition-colors"
                                    placeholder="Ej: Juanito P"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] uppercase font-bold text-oficina-verde/60 ml-1">Número de Celular</label>
                                <input 
                                    required
                                    type="tel"
                                    className="w-full bg-white border border-oficina-verde/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-oficina-verde transition-colors"
                                    placeholder="300 000 0000"
                                    value={formData.phone}
                                    onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                />
                            </div>
                            
                            <div className="flex gap-3 pt-2">
                                <input 
                                    required
                                    id="consent"
                                    type="checkbox" 
                                    className="mt-1 h-4 w-4 rounded"
                                    checked={formData.consent}
                                    onChange={(e) => setFormData({...formData, consent: e.target.checked})}
                                />
                                <label htmlFor="consent" className="text-[9px] text-oficina-verde/70 leading-relaxed font-medium">
                                    Acepto que mis datos se utilicen con fines comerciales y para recibir promociones de LA OFICINA Coffee Bar vía SMS.
                                </label>
                            </div>

                            <button 
                                disabled={status === 'loading'}
                                type="submit"
                                className="w-full bg-oficina-verde text-oficina-bg font-black py-4 rounded-xl uppercase tracking-[0.2em] text-[11px] shadow-lg shadow-oficina-verde/20 active:scale-95 transition-all disabled:opacity-50 mt-4"
                            >
                                {status === 'loading' ? 'Procesando...' : 'Registrarme ahora'}
                            </button>
                        </form>
                    </>
                )}
            </div>
        </div>
    );
};

        const ProductGridItem = ({ product, onClick }) => (
            <div className="cursor-pointer group flex flex-col h-full" onClick={() => onClick(product)}>
                <div className="relative aspect-square overflow-hidden bg-white/40 border border-oficina-verde/10 rounded-lg mb-2">
                    {product.imageUrl ? (
                        <img src={product.imageUrl} alt={product.name} className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
                    ) : (
                        <div className="w-full h-full flex flex-col items-center justify-center p-2 text-center">
                             <LogoOficina className="w-8 h-8 opacity-20 mb-1" />
                        </div>
                    )}
                </div>
                <div className="px-1 flex flex-col flex-grow space-y-1">
                    <h4 className="text-[8px] font-extrabold text-oficina-verde uppercase tracking-tighter leading-[1.1] break-words">
                        {product.name}
                    </h4>
                    <p className="text-[10px] font-medium text-oficina-gris tracking-tighter leading-none mt-auto">
                        ${product.price.toLocaleString()}
                    </p>
                </div>
            </div>
        );

        const ProductModal = ({ product, onClose }) => (
            <div className="fixed inset-0 z-50 bg-oficina-bg/95 flex flex-col items-center justify-center p-4 animate-fadeIn" onClick={onClose}>
                <button onClick={onClose} className="absolute top-6 right-6 p-2 text-oficina-verde hover:scale-110 transition-transform"><X size={32} /></button>
                <div className="max-w-md w-full bg-white rounded-[2.5rem] overflow-hidden shadow-2xl border border-oficina-verde/5" onClick={(e) => e.stopPropagation()}>
                    {product.imageUrl ? (
                        <img src={product.imageUrl} alt={product.name} className="w-full aspect-square object-cover" />
                    ) : (
                        <div className="w-full aspect-square bg-oficina-bg/30 flex flex-col items-center justify-center p-8 border-b border-oficina-verde/10">
                            <LogoOficina className="w-32 h-32 opacity-20 mb-4" />
                        </div>
                    )}
                    <div className="p-8">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-[10px] uppercase tracking-[0.3em] font-bold text-oficina-gris mb-1">{product.category}</p>
                                <h3 className="font-bold text-2xl text-oficina-verde leading-tight">{product.name}</h3>
                            </div>
                            <span className="font-black text-oficina-verde text-xl mt-1">${product.price.toLocaleString()}</span>
                        </div>
                        {product.description && <p className="text-sm text-oficina-verde/70 leading-relaxed mb-6 font-medium">{product.description}</p>}
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [inventory, setInventory] = useState([]);
            const [combos, setCombos] = useState([]);
            const [categories, setCategories] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [activeCategory, setActiveCategory] = useState('');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [isRegOpen, setIsRegOpen] = useState(false);
            const [showInvite, setShowInvite] = useState(false);
            
            // --- ESTADOS TRAZABILIDAD ---
            const [tvConfig, setTvConfig] = useState(null);
            const [showTraceability, setShowTraceability] = useState(false);

            useEffect(() => {
                const unsubInv = db.collection('inventory').onSnapshot(snap => setInventory(snap.docs.map(doc => doc.data())));
                const unsubComb = db.collection('combos').onSnapshot(snap => {
                    setCombos(snap.docs.map(doc => doc.data()));
                    setIsLoading(false);
                });
                
                // Escucha de configuración de trazabilidad desde Firebase
                const unsubConfig = db.collection('configuracionTV').doc('actual').onSnapshot(doc => {
                    if (doc.exists) {
                        setTvConfig(doc.data());
                        setShowTraceability(true);
                    }
                });

                return () => { unsubInv(); unsubComb(); unsubConfig(); };
            }, []);

            useEffect(() => {
                const timer = setTimeout(() => {
                    setShowInvite(true);
                }, 3000);
                return () => clearTimeout(timer);
            }, []);

            const displayInventory = useMemo(() => [...inventory, ...combos], [inventory, combos]);

            useEffect(() => {
                if (displayInventory.length > 0) {
                    const exactCategories = [
                        "CAFE", 
                        "INFUSIONES", 
                        "REFRESCANTES", 
                        "CACAO Y LACTEOS", 
                        "PARA COMER", 
                        "COCKTAILS", 
                        "CERVEZAS", 
                        "PARA BRINDAR",
                        "Combos"
                    ];
                    
                    const categoriesWithProducts = exactCategories.filter(cat => 
                        displayInventory.some(item => item.category === cat)
                    );
                    setCategories(categoriesWithProducts);
                    if (!activeCategory && categoriesWithProducts.length > 0) {
                        setActiveCategory(categoriesWithProducts.includes("CAFE") ? "CAFE" : categoriesWithProducts[0]);
                    }
                }
            }, [displayInventory]);

            const scrollToCategory = (category) => {
                setActiveCategory(category);
                const element = document.getElementById(`cat-${category}`);
                if (element) {
                    const y = element.getBoundingClientRect().top + window.scrollY - 130; 
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }
            };

            if (isLoading) return (
                <div className="min-h-screen bg-oficina-bg flex flex-col items-center justify-center">
                    <LogoOficina className="w-20 h-20 mb-2" />
                    <h2 className="font-[200] text-oficina-verde tracking-[0.4em] text-[12px] uppercase">La Oficina</h2>
                    <p className="font-[200] text-oficina-gris tracking-[0.2em] text-[8px] uppercase mt-0.5">Coffee Bar</p>
                </div>
            );

            return (
                <div className="relative min-h-screen pb-24 max-w-md mx-auto bg-oficina-bg shadow-inner overflow-hidden">
                    <header className="relative bg-oficina-bg pb-10 pt-16 px-6 z-20 flex flex-col items-center text-center">
                        <button 
                            onClick={() => setIsRegOpen(true)}
                            className="absolute top-6 left-6 flex items-center gap-1.5 text-oficina-verde/40 hover:text-oficina-verde transition-colors"
                        >
                            <UserPlus size={14} />
                            <span className="text-[8px] font-black uppercase tracking-widest">Club Oficina</span>
                        </button>

                        <LogoOficina className="w-24 h-24 mb-2" />
                        <div className="mb-6">
                            <h1 className="font-[200] text-2xl tracking-[0.4em] uppercase text-oficina-verde mb-1">La Oficina</h1>
                            <p className="font-[200] text-[10px] tracking-[0.5em] uppercase text-oficina-gris">Coffee Bar</p>
                        </div>
                        
                        <div className="flex flex-col gap-3 items-center">
                            <div className="flex items-center justify-center gap-2 text-[9px] uppercase tracking-widest text-oficina-verde/60 border border-oficina-verde/10 px-4 py-1.5 rounded-full bg-white/20">
                                <span className="w-1.5 h-1.5 rounded-full bg-oficina-verde animate-pulse"></span>
                                Catálogo en Vivo
                            </div>

                            <a 
                                href="https://instagram.com/laoficinaanserma" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="flex items-center gap-2 bg-oficina-verde text-oficina-bg px-5 py-2 rounded-full shadow-lg hover:scale-105 transition-transform active:scale-95"
                            >
                                <Instagram size={14} />
                                <span className="text-[10px] font-bold uppercase tracking-widest">Siguenos en intagram</span>
                            </a>
                        </div>
                    </header>

                    <div className="sticky top-0 z-30 bg-oficina-bg/80 backdrop-blur-md border-b border-oficina-verde/10 py-4 px-4">
                        <div className="flex gap-6 overflow-x-auto scrollbar-hide pb-2">
                            {categories.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => scrollToCategory(cat)}
                                    className={`whitespace-nowrap text-[10px] uppercase tracking-widest font-bold transition-all border-b-2 pb-1 ${activeCategory === cat ? 'text-oficina-verde border-oficina-verde' : 'text-oficina-gris border-transparent'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="px-4 py-2 space-y-12">
                        {categories.map(category => {
                            const productsInCategory = displayInventory.filter(p => p.category === category);
                            if (productsInCategory.length === 0) return null;
                            return (
                                <div key={category} id={`cat-${category}`} className="scroll-mt-36">
                                    <h2 className="text-[11px] font-black uppercase tracking-[0.3em] text-oficina-verde mb-6 mt-6 border-l-4 border-oficina-verde pl-3">{category}</h2>
                                    <div className="grid grid-cols-3 gap-x-2 gap-y-12">
                                        {productsInCategory.map(product => (
                                            <ProductGridItem key={product.id} product={product} onClick={setSelectedProduct} />
                                        ))}
                                    </div>
                                </div>
                            )
                        })}
                    </div>

                    <div className="pt-20 pb-12 flex flex-col items-center gap-6">
                        <div className="flex flex-col items-center opacity-40">
                            <LogoOficina className="w-10 h-10 mb-1" />
                            <p className="font-[200] text-[7px] tracking-[0.3em] uppercase text-oficina-verde">La Oficina Coffee Bar</p>
                        </div>
                        
                        <a 
                            href="https://instagram.com/laoficinaanserma" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="flex items-center gap-2 border border-oficina-verde/30 text-oficina-verde px-6 py-2.5 rounded-xl hover:bg-oficina-verde hover:text-white transition-colors"
                        >
                            <Instagram size={16} />
                            <span className="text-[9px] font-black uppercase tracking-2em">Visítanos en Instagram</span>
                        </a>
                    </div>

                    {selectedProduct && (
                        <ProductModal product={selectedProduct} onClose={() => setSelectedProduct(null)} />
                    )}

                    {showInvite && !isRegOpen && (
                        <div className="fixed bottom-4 left-4 right-4 sm:left-1/2 sm:-translate-x-1/2 sm:w-[400px] z-50 bg-oficina-verde text-oficina-bg p-5 rounded-2xl shadow-2xl animate-slideUp border border-oficina-bg/20 flex flex-col gap-3">
                            <div className="flex items-start justify-between">
                                <div>
                                    <h4 className="font-black text-[14px] uppercase tracking-widest mb-1 flex items-center gap-2">
                                        <span>🎁</span> ¡Únete y Gana!
                                    </h4>
                                    <p className="text-[10px] opacity-90 leading-relaxed pr-2">
                                        Regístrate en nuestro Club y accede a <strong>descuentos increíbles y promociones exclusivas</strong> antes que nadie.
                                    </p>
                                </div>
                                <button 
                                    onClick={() => setShowInvite(false)}
                                    className="text-oficina-bg/50 hover:text-oficina-bg transition-colors"
                                >
                                    <X size={18} />
                                </button>
                            </div>
                            <button 
                                onClick={() => {
                                    setShowInvite(false);
                                    setIsRegOpen(true);
                                }}
                                className="w-full bg-oficina-bg text-oficina-verde text-[11px] font-black py-3 rounded-xl uppercase tracking-widest shadow-lg hover:scale-[1.02] active:scale-95 transition-all mt-1"
                            >
                                Ver promociones ahora
                            </button>
                        </div>
                    )}

                    <RegistrationModal isOpen={isRegOpen} onClose={() => setIsRegOpen(false)} />

                    {/* --- ANUNCIO DE TRAZABILIDAD --- */}
                    <TraceabilityAnnouncement 
                        data={tvConfig} 
                        isOpen={showTraceability} 
                        onClose={() => setShowTraceability(false)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
