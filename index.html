<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Interactivo | LA OFICINA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oficina: {
                            bg: '#f4f4ee',      
                            verde: '#014025',   
                            accent: '#D4AF37',  
                            dark: '#002616',    
                        }
                    },
                    animation: {
                        'slideUp': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'spin-slow': 'spin 8s linear infinite',
                        'bar': 'bar-height 1.2s ease-in-out infinite',
                    },
                    keyframes: {
                        slideUp: { '0%': { transform: 'translateY(100%)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        'bar-height': { '0%, 100%': { height: '4px' }, '50%': { height: '16px' } }
                    }
                }
            }
        }
    </script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f4ee; color: #014025; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-oficina-bg text-oficina-verde">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        const HABLAME_CONFIG = {
            apiKey: "HHajMRAMKfQrSqkw4WA5dwuWh8xl9RJDeyQTanQJDKXpCLOgPzNEDF1hnY93zd39Ge7tXt20b3nTsMEocV6B0ibTIrvxmgjtN1OmUguZGja4zkABwNW0GdUqmoJ67Zq6",
            endpoint: "https://api103.hablame.co/api/sms/v3/send/marketing"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const LogoOficina = ({ className }) => (
            <svg className={className} viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100,70 c10,-20, -10,-40, 0,-60" stroke="currentColor" strokeWidth="8" strokeLinecap="round" className="opacity-30" />
                <path d="M40,95 h120 c0,0,0,60-60,60 S40,95,40,95 z" stroke="currentColor" strokeWidth="10" strokeLinejoin="round" />
                <path d="M160,105 c15,0,25,10,25,22 s-10,22-25,22" stroke="currentColor" strokeWidth="10" />
            </svg>
        );

        const RegistrationModal = ({ isOpen, onClose }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', consent: false });
            const [status, setStatus] = useState('idle');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.consent) return;
                setStatus('loading');
                try {
                    await db.collection('customers').add({ ...formData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    const firstName = formData.name.split(' ')[0];
                    await fetch(HABLAME_CONFIG.endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': HABLAME_CONFIG.apiKey },
                        body: JSON.stringify({ phone: `57${formData.phone}`, message: `Hola ${firstName}, bienvenido al Club de LA OFICINA.`, flash: 0 })
                    });
                    setStatus('success');
                    setTimeout(() => { onClose(); setStatus('idle'); }, 2000);
                } catch (e) { setStatus('idle'); }
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[120] bg-oficina-dark/80 backdrop-blur-md flex items-end sm:items-center justify-center">
                    <div className="bg-white w-full max-w-md rounded-t-[3rem] p-10 animate-slideUp relative">
                        <button onClick={onClose} className="absolute top-8 right-8 opacity-20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
                        {status === 'success' ? (
                            <div className="py-10 text-center space-y-4">
                                <div className="w-20 h-20 bg-oficina-verde text-white rounded-full flex items-center justify-center mx-auto text-3xl animate-bounce">✓</div>
                                <h3 className="font-black text-oficina-verde uppercase">¡Ya eres del Club!</h3>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-6">
                                <h2 className="text-2xl font-black uppercase text-oficina-verde leading-tight">Únete al Club <br/><span className="text-oficina-accent text-sm">Gana descuentos exclusivos</span></h2>
                                <input required className="w-full bg-oficina-bg p-5 rounded-2xl outline-none" placeholder="Nombre completo" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                <input required type="tel" className="w-full bg-oficina-bg p-5 rounded-2xl outline-none" placeholder="WhatsApp (300...)" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} />
                                <div className="flex gap-3 px-2">
                                    <input required type="checkbox" className="mt-1" checked={formData.consent} onChange={e => setFormData({...formData, consent: e.target.checked})} />
                                    <p className="text-[10px] font-bold opacity-50 uppercase tracking-tighter">Acepto recibir promociones de La Oficina vía SMS.</p>
                                </div>
                                <button className="w-full bg-oficina-verde text-white font-black py-5 rounded-2xl uppercase tracking-[0.2em] shadow-xl">Registrarme ahora</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const TraceabilityStory = ({ data, isOpen, onClose }) => {
            if (!isOpen || !data) return null;
            const cafe = data.cafePromocion || {};
            return (
                <div className="fixed inset-0 z-[110] bg-oficina-dark flex items-center justify-center p-0 sm:p-4">
                    <div className="relative w-full max-w-sm h-full sm:h-[90vh] bg-oficina-verde rounded-none sm:rounded-[3rem] overflow-hidden flex flex-col">
                        <div className="absolute top-0 inset-x-0 h-40 bg-gradient-to-b from-black/60 to-transparent z-10"></div>
                        <button onClick={onClose} className="absolute top-10 right-8 z-50 text-white/40"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
                        
                        <div className="flex-1 overflow-y-auto scrollbar-hide p-8 relative z-20">
                            <div className="mt-12 mb-8">
                                <span className="bg-oficina-accent/20 border border-oficina-accent/30 text-oficina-accent px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest">En Barra Ahora</span>
                                <h2 className="text-white text-5xl font-black uppercase tracking-tighter leading-none mt-4">{data.publicidadRecurrente?.textoConfigurable || "Specialty Coffee"}</h2>
                            </div>

                            <div className="flex justify-center my-10"><LogoOficina className="w-44 h-44 text-oficina-bg/90" /></div>

                            <div className="space-y-4">
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-2xl rotate-1">
                                    <p className="text-[9px] font-black text-oficina-gris uppercase mb-2">Notas de Sabor</p>
                                    <p className="text-xl font-bold italic text-oficina-dark leading-tight">"{cafe.notas || 'Cuerpo sedoso y dulzor natural'}"</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="glass p-5 rounded-[2rem] text-white">
                                        <p className="text-[8px] font-bold text-oficina-accent uppercase mb-1">Vereda</p>
                                        <p className="font-black text-xs uppercase">{cafe.vereda || 'Anserma'}</p>
                                    </div>
                                    <div className="glass p-5 rounded-[2rem] text-white">
                                        <p className="text-[8px] font-bold text-oficina-accent uppercase mb-1">Altura</p>
                                        <p className="font-black text-xs">{cafe.altura || '1850'} <span className="text-[8px]">MSNM</span></p>
                                    </div>
                                    <div className="glass p-5 rounded-[2rem] text-white">
                                        <p className="text-[8px] font-bold text-oficina-accent uppercase mb-1">Proceso</p>
                                        <p className="font-black text-xs uppercase">{cafe.procesador || 'Lavado'}</p>
                                    </div>
                                    <div className="glass p-5 rounded-[2rem] text-white">
                                        <p className="text-[8px] font-bold text-oficina-accent uppercase mb-1">Tueste</p>
                                        <p className="font-black text-xs uppercase">{cafe.diaTueste || 'Medio'}</p>
                                    </div>
                                </div>
                                <div className="h-10"></div>
                            </div>
                        </div>
                        <div className="p-8 bg-oficina-verde/90 backdrop-blur-md">
                            <button onClick={onClose} className="w-full bg-oficina-accent text-oficina-dark font-black py-5 rounded-2xl uppercase tracking-[0.2em] shadow-2xl">Entrar al Menú</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState({ inventory: [], combos: [] });
            const [isLoading, setIsLoading] = useState(true);
            const [activeCategory, setActiveCategory] = useState('CAFE');
            const [isRegOpen, setIsRegOpen] = useState(false);
            const [tvConfig, setTvConfig] = useState(null);
            const [showStory, setShowStory] = useState(false);

            useEffect(() => {
                const unsubInv = db.collection('inventory').onSnapshot(snap => {
                    const items = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setData(prev => ({ ...prev, inventory: items }));
                });
                const unsubComb = db.collection('combos').onSnapshot(snap => {
                    const items = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setData(prev => ({ ...prev, combos: items }));
                    setIsLoading(false);
                });
                const unsubConfig = db.collection('configuracionTV').doc('actual').onSnapshot(doc => {
                    if (doc.exists) { setTvConfig(doc.data()); setShowStory(true); }
                });
                return () => { unsubInv(); unsubComb(); unsubConfig(); };
            }, []);

            const closeStoryAndInvite = () => {
                setShowStory(false);
                setTimeout(() => setIsRegOpen(true), 800);
            };

            const allProducts = useMemo(() => [...data.inventory, ...data.combos], [data]);
            const categories = ["CAFE", "INFUSIONES", "REFRESCANTES", "PARA COMER", "COCKTAILS", "Combos"];

            if (isLoading) return <div className="min-h-screen bg-oficina-dark flex items-center justify-center"><LogoOficina className="w-16 h-16 text-oficina-accent animate-pulse" /></div>;

            return (
                <div className="min-h-screen max-w-md mx-auto bg-oficina-bg pb-24 shadow-2xl">
                    <header className="pt-16 pb-10 px-6 text-center">
                        <button onClick={() => setIsRegOpen(true)} className="absolute top-8 left-6 flex items-center gap-2 text-oficina-verde/40 font-black text-[9px] uppercase tracking-widest border border-oficina-verde/10 px-4 py-2 rounded-full">🎁 Club VIP</button>
                        <LogoOficina className="w-20 h-20 mx-auto mb-4 text-oficina-verde" />
                        <h1 className="text-3xl font-black uppercase tracking-tighter mb-8">La Oficina</h1>
                        
                        <div className="space-y-4">
                            {/* Spotify Jam */}
                            <a href="https://spotify.link/2O9zOMPBa3b" target="_blank" className="w-full bg-black rounded-[2rem] p-5 flex items-center gap-4 relative overflow-hidden group shadow-2xl">
                                <div className="relative w-12 h-12 flex-shrink-0 bg-zinc-800 rounded-full flex items-center justify-center border border-zinc-700 animate-spin-slow">
                                    <div className="w-3 h-3 bg-black rounded-full"></div>
                                </div>
                                <div className="text-left">
                                    <div className="flex gap-1 mb-1">
                                        {[0.1, 0.4, 0.2].map(d => <div key={d} className="w-1 h-3 bg-[#1DB954] animate-bar" style={{animationDelay: `${d}s`}}></div>)}
                                        <span className="text-[8px] font-black text-[#1DB954] uppercase tracking-widest ml-2">Live Jam Session</span>
                                    </div>
                                    <p className="text-white font-bold text-xs">Poner mi música ahora</p>
                                </div>
                            </a>
                        </div>
                    </header>

                    <nav className="sticky top-0 z-40 bg-oficina-bg/90 backdrop-blur-xl border-b border-oficina-verde/5 py-5 flex gap-8 overflow-x-auto scrollbar-hide px-6">
                        {categories.map(cat => (
                            <button key={cat} onClick={() => setActiveCategory(cat)} className={`whitespace-nowrap text-[10px] font-black uppercase tracking-widest transition-all ${activeCategory === cat ? 'text-oficina-verde border-b-2 border-oficina-verde' : 'text-oficina-gris opacity-30'}`}>{cat}</button>
                        ))}
                    </nav>

                    <div className="p-6 grid grid-cols-2 gap-4">
                        {allProducts.filter(p => p.category === activeCategory).map(product => (
                            <div key={product.id} className="bg-white p-4 rounded-[2.5rem] shadow-sm border border-oficina-verde/5 flex flex-col active:scale-95 transition-all">
                                <div className="aspect-square bg-oficina-bg rounded-[2rem] mb-4 overflow-hidden">
                                    {product.imageUrl ? <img src={product.imageUrl} className="w-full h-full object-cover" /> : <LogoOficina className="w-full h-full p-8 opacity-5" />}
                                </div>
                                <h3 className="text-[10px] font-black uppercase mb-1 leading-tight">{product.name}</h3>
                                <p className="text-sm font-bold text-oficina-verde mt-auto">${product.price?.toLocaleString()}</p>
                            </div>
                        ))}
                    </div>

                    <TraceabilityStory data={tvConfig} isOpen={showStory} onClose={closeStoryAndInvite} />
                    <RegistrationModal isOpen={isRegOpen} onClose={() => setIsRegOpen(false)} />
                    
                    {!showStory && (
                        <button onClick={() => setShowStory(true)} className="fixed bottom-8 right-6 w-14 h-14 bg-oficina-accent rounded-full shadow-2xl flex items-center justify-center text-xl animate-bounce z-50">☕</button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
