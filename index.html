<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Oficina Coffee Bar</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --green: #2d5a27; }
        
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            background: #f8f8f8;
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
        }

        /* Pantalla Inicial */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .logo-text { margin-bottom: 20px; }

        .welcome-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            max-width: 340px;
            padding: 13px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin: 12px 0;
        }

        .checkbox {
            margin: 12px 0 20px 0;
            font-size: 13.5px;
            max-width: 340px;
            text-align: left;
        }

        .btn {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
        }

        .btn-primary { background: var(--green); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }

        /* Menú Principal */
        #main-content { display: none; }

        header {
            text-align: center;
            padding: 20px 20px 12px;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        #categories {
            display: flex;
            overflow-x: auto;
            padding: 12px 10px;
            gap: 10px;
            background: white;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
        }
        #categories::-webkit-scrollbar { display: none; }

        .cat-pill {
            padding: 11px 20px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--green);
            border: 2px solid var(--green);
            border-radius: 50px;
            white-space: nowrap;
            background: white;
        }
        
        .cat-pill.active {
            background: var(--green);
            color: white;
        }

        /* Loading */
        #loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--green);
            font-size: 16px;
        }

        .feed {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
        }

        .post {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .post-img-container {
            position: relative;
            width: 100%;
            padding-top: 110%; /* Imagen bien visible */
        }

        .post img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .post-info {
            padding: 16px;
        }

        .post-info h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .post-info p {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
        }

        .price {
            font-size: 19px;
            font-weight: 700;
            color: var(--green);
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Pantalla Inicial -->
    <div id="welcome-screen">
        <div class="logo-text">
            <svg width="260" height="90" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="160" y="52" font-family="Montserrat" font-size="29" font-weight="700" fill="#2d5a27" letter-spacing="-1.8px" text-anchor="middle">LA OFICINA</text>
                <text x="160" y="77" font-family="Montserrat" font-size="11" font-weight="600" fill="#2d5a27" letter-spacing="5.5px" text-anchor="middle">COFFEE BAR</text>
            </svg>
        </div>

        <h1 class="welcome-title">¡Bienvenido a La Oficina!</h1>
        <p style="max-width:320px; color:#555; margin-bottom:20px;">
            Únete a nuestro club y recibe ofertas especiales
        </p>

        <input type="text" id="nombre" placeholder="Tu nombre completo" required>
        <input type="tel" id="telefono" placeholder="Número de WhatsApp" required>

        <label class="checkbox">
            <input type="checkbox" id="autorizacion" checked>
            Autorizo recibir promociones del club
        </label>

        <button onclick="registrarCliente()" class="btn btn-primary">Unirme al Club</button>
        <button onclick="skipToMenu()" class="btn btn-secondary">Ver Menú sin registrarme</button>

        <div style="margin-top: 25px; width:100%; max-width:340px;">
            <button onclick="window.open('https://www.instagram.com/laoficinaanserma?igsh=MWtzOHE4OWx3MTk1dw==','_blank')" class="btn btn-secondary">📸 Síguenos en Instagram</button>
            <button onclick="window.open('https://wa.me/573334319847?text=Hola,%20quiero%20enviar%20una%20queja,%20sugerencia%20o%20felicitación','_blank')" class="btn btn-secondary">✉️ Quejas / Sugerencias</button>
            <button onclick="alert('Portal de empleo en construcción. Próximamente disponible.')" class="btn btn-secondary">💼 Trabaja con Nosotros</button>
        </div>
    </div>

    <!-- Menú Principal -->
    <div id="main-content">
        <header>
            <svg width="260" height="85" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="160" y="50" font-family="Montserrat" font-size="27" font-weight="700" fill="#2d5a27" letter-spacing="-1.6px" text-anchor="middle">LA OFICINA</text>
                <text x="160" y="74" font-family="Montserrat" font-size="10.5" font-weight="600" fill="#2d5a27" letter-spacing="5px" text-anchor="middle">COFFEE BAR</text>
            </svg>
        </header>

        <div id="categories"></div>
        
        <div id="loading">Cargando menú <span style="display:inline-block; width:20px; animation: dots 1.5s infinite;">...</span></div>
        
        <div id="menu-container" class="feed"></div>

        <footer>LA OFICINA COFFEE BAR</footer>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allProducts = [];

        function registrarCliente() {
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const autorizacion = document.getElementById('autorizacion').checked;

            if (!nombre || !telefono) {
                alert("Por favor completa tu nombre y número");
                return;
            }

            db.collection('clients').add({
                nombre: nombre,
                telefono: telefono,
                autorizacionClub: autorizacion,
                fecha: new Date()
            }).then(() => {
                alert("¡Gracias por registrarte! 🎉");
                skipToMenu();
            }).catch(() => alert("Error al guardar. Inténtalo nuevamente."));
        }

        function skipToMenu() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadMenu();
        }

        function loadMenu() {
            const loadingEl = document.getElementById('loading');
            const container = document.getElementById('menu-container');
            
            db.collection('inventory').onSnapshot(snap => {
                loadingEl.style.display = 'none';
                allProducts = [];
                let cats = new Set(['TODOS']);

                snap.forEach(doc => {
                    const p = doc.data();
                    if (p.showOnTv !== false) {
                        allProducts.push(p);
                        if (p.category) cats.add(p.category.toUpperCase());
                    }
                });

                const catHTML = Array.from(cats).map(c => 
                    `<div class="cat-pill ${c==='TODOS'?'active':''}" onclick="filterMenu('${c}')">${c}</div>`
                ).join('');
                document.getElementById('categories').innerHTML = catHTML;

                renderMenu(allProducts);
            });
        }

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            container.innerHTML = items.map(p => `
                <div class="post">
                    <div class="post-img-container">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/600x750/eeeeee/2d5a27?text=Sin+Imagen'}" alt="${p.name}">
                    </div>
                    <div class="post-info">
                        <h3>${p.name}</h3>
                        <p>${p.description || ''}</p>
                        <div class="price">$${Number(p.price).toLocaleString('es-CO')}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterMenu(cat) {
            document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            const filtered = cat === 'TODOS' 
                ? allProducts 
                : allProducts.filter(p => (p.category || '').toUpperCase() === cat);
            renderMenu(filtered);
        }
    </script>
</body>
</html>
